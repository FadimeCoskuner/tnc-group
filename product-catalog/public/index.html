<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Kataloğu</title>

    <!-- Yazı tipi: modern ve okunaklı -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN): kurulum gerektirmez, internet bağlantısı yeterli -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        };
    </script>
</head>

<body class="min-h-screen bg-gray-50 font-sans text-gray-800">

    <!-- ---------- Üst menü ---------- -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-xl">🛍️</div>
                <div>
                    <h1 class="text-xl font-bold">Ürün Kataloğu</h1>
                    <p class="text-xs text-gray-500">Stok ve fiyat yönetimi</p>
                </div>
            </div>
            <span id="count" class="text-sm text-gray-500"></span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 grid gap-8 lg:grid-cols-4">

        <!-- ---------- Sol: Ürün ekleme / düzenleme formu ---------- -->
        <aside class="lg:col-span-1">
            <div class="bg-white rounded-2xl border border-gray-200 p-5 lg:sticky lg:top-24">
                <h2 id="form-title" class="font-semibold text-lg mb-4">Yeni Ürün</h2>

                <form id="product-form" class="space-y-3">
                    <!-- Düzenleme modunda dolu, ekleme modunda boş olur -->
                    <input type="hidden" id="product-id">

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1" for="name">Ürün adı</label>
                        <input id="name" type="text"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1" for="price">Fiyat (₺)</label>
                            <!-- min yazmadık: fiyat kontrolünü sunucu (validateProduct) yapıyor -->
                            <input id="price" type="number" step="0.01"
                                class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1" for="stock">Stok</label>
                            <input id="stock" type="number"
                                class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1" for="category">Kategori</label>
                        <!-- list: yazarken mevcut kategorileri öneri olarak gösterir -->
                        <input id="category" type="text" list="category-options" placeholder="electronics"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <datalist id="category-options"></datalist>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button id="submit-btn" type="submit"
                            class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg">
                            Ekle
                        </button>
                        <!-- Sadece düzenleme modunda görünür -->
                        <button id="cancel-btn" type="button"
                            class="hidden px-4 bg-gray-100 hover:bg-gray-200 rounded-lg">
                            Vazgeç
                        </button>
                    </div>
                </form>

                <!-- Sunucudan gelen başarı / hata mesajı -->
                <div id="message" class="hidden mt-4 text-sm rounded-lg px-3 py-2"></div>
            </div>
        </aside>

        <!-- ---------- Sağ: Filtreler ve ürün listesi ---------- -->
        <section class="lg:col-span-3">

            <!-- Kategori butonları: /products?category=... -->
            <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
                <div id="category-tabs" class="flex flex-wrap gap-2"></div>

                <!-- Sıralama: /products?sort=...&order=... -->
                <select id="sort"
                    class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="">Sıralama: Varsayılan</option>
                    <option value="price-asc">Fiyat: Düşükten yükseğe</option>
                    <option value="price-desc">Fiyat: Yüksekten düşüğe</option>
                    <option value="stock-desc">Stok: Çoktan aza</option>
                    <option value="name-asc">İsim: A → Z</option>
                </select>
            </div>

            <!-- Ürün kartları JavaScript ile buraya eklenir -->
            <div id="product-list" class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
