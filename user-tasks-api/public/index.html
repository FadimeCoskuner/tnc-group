<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev Takip</title>

    <!-- Yazı tipi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN): kurulum gerektirmez, internet bağlantısı yeterli -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] }
                }
            }
        };
    </script>
</head>

<body class="min-h-screen bg-slate-100 font-sans text-slate-800">

    <div class="min-h-screen flex flex-col md:flex-row">

        <!-- ---------- Sol menü: kullanıcılar ---------- -->
        <aside class="md:w-72 bg-slate-900 text-slate-200 flex flex-col md:min-h-screen">
            <div class="px-6 py-6 border-b border-slate-800">
                <h1 class="text-xl font-bold text-white">✅ Görev Takip</h1>
                <p class="text-xs text-slate-400 mt-1">Kullanıcılar ve görevleri</p>
            </div>

            <!-- "Tüm görevler" ve kullanıcı listesi JavaScript ile doldurulur -->
            <nav id="user-list" class="flex-1 px-3 py-4 space-y-1"></nav>

            <!-- Yeni kullanıcı formu -->
            <form id="user-form" class="px-6 py-5 border-t border-slate-800 space-y-2">
                <p class="text-xs uppercase tracking-wider text-slate-500 mb-1">Yeni kullanıcı</p>
                <input id="user-name" type="text" placeholder="İsim" required
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder:text-slate-500 focus:outline-none focus:border-violet-500">
                <input id="user-email" type="email" placeholder="E-posta" required
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder:text-slate-500 focus:outline-none focus:border-violet-500">
                <button type="submit"
                    class="w-full bg-violet-600 hover:bg-violet-500 text-white text-sm font-medium py-2 rounded-lg">
                    Kullanıcı ekle
                </button>
            </form>
        </aside>

        <!-- ---------- Sağ: görevler ---------- -->
        <main class="flex-1 p-6 md:p-10">
            <div class="max-w-3xl mx-auto">

                <!-- Başlık: seçili kullanıcı veya "Tüm görevler" -->
                <div class="flex flex-wrap items-start justify-between gap-4 mb-6">
                    <div>
                        <h2 id="page-title" class="text-2xl font-bold">Tüm görevler</h2>
                        <p id="page-subtitle" class="text-sm text-slate-500 mt-1"></p>
                    </div>
                    <!-- Sadece bir kullanıcı seçiliyken görünür -->
                    <button id="delete-user-btn"
                        class="hidden text-sm text-red-600 hover:bg-red-50 border border-red-200 px-3 py-1.5 rounded-lg">
                        Kullanıcıyı sil
                    </button>
                </div>

                <!-- İlerleme çubuğu: tamamlanan görev yüzdesi -->
                <div class="bg-white rounded-2xl p-5 shadow-sm mb-6">
                    <div class="flex justify-between text-sm mb-2">
                        <span class="text-slate-500">İlerleme</span>
                        <span id="progress-text" class="font-semibold"></span>
                    </div>
                    <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-violet-600 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Yeni görev formu -->
                <form id="task-form" class="bg-white rounded-2xl p-3 shadow-sm mb-6 flex flex-col sm:flex-row gap-2">
                    <input id="task-title" type="text" placeholder="Yeni görev yaz..." required
                        class="flex-1 px-3 py-2 rounded-lg focus:outline-none focus:bg-slate-50">
                    <!-- Görevin hangi kullanıcıya ait olacağı (userId) -->
                    <select id="task-user"
                        class="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:border-violet-500"></select>
                    <button type="submit"
                        class="bg-violet-600 hover:bg-violet-700 text-white font-medium px-5 py-2 rounded-lg">
                        Ekle
                    </button>
                </form>

                <!-- Durum filtresi -->
                <div id="status-tabs" class="flex gap-1 bg-slate-200/70 p-1 rounded-xl w-fit mb-4">
                    <button data-status="all" class="status-tab px-4 py-1.5 text-sm rounded-lg">Tümü</button>
                    <button data-status="false" class="status-tab px-4 py-1.5 text-sm rounded-lg">Devam eden</button>
                    <button data-status="true" class="status-tab px-4 py-1.5 text-sm rounded-lg">Tamamlanan</button>
                </div>

                <!-- Görev listesi JavaScript ile doldurulur -->
                <ul id="task-list" class="space-y-2"></ul>

                <!-- Sunucudan gelen mesaj (sağ altta kısa süre görünür) -->
                <div id="toast"
                    class="hidden fixed bottom-6 right-6 px-4 py-3 rounded-xl shadow-lg text-sm text-white"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
